<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Dashboard — Central Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Biblioteca Oficial Supabase JS v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-base: #07090e;
      --bg-surface: rgba(18, 24, 38, 0.75);
      --bg-surface-hover: rgba(26, 35, 54, 0.85);
      --bg-card-inner: rgba(10, 14, 23, 0.65);
      --bg-input: #0b0f19;
      
      --border-subtle: rgba(255, 255, 255, 0.07);
      --border-highlight: rgba(56, 189, 248, 0.35);
      --border-focus: #38bdf8;
      
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
      
      --benchmark-color: #a855f7;
      
      --tv-green: #10b981;
      --tv-green-bg: rgba(16, 185, 129, 0.12);
      --tv-green-border: rgba(16, 185, 129, 0.28);
      
      --tv-red: #ef4444;
      --tv-red-bg: rgba(239, 68, 68, 0.12);
      --tv-red-border: rgba(239, 68, 68, 0.28);
      
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      
      --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --shadow-card: 0 12px 32px -4px rgba(0, 0, 0, 0.5), 0 4px 12px -2px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: var(--font);
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(37, 99, 235, 0.06) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(16, 185, 129, 0.04) 0px, transparent 60%);
      background-attachment: fixed;
      color: var(--text-primary);
      padding: 30px 24px 60px;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .container {
      max-width: 1220px;
      margin: 0 auto;
    }

    .top-bar-redesign {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding: 10px 16px;
      background: rgba(18, 24, 38, 0.6);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      backdrop-filter: blur(14px);
      flex-wrap: wrap;
      gap: 14px;
      box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.4);
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 2px 10px rgba(56, 189, 248, 0.35);
    }
    .brand-title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: #f8fafc;
    }

    .status-badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--tv-green);
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--tv-green-bg);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--tv-green-border);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--tv-green);
      box-shadow: 0 0 6px var(--tv-green);
    }
    .status-badge.loading {
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.12);
      border-color: rgba(245, 158, 11, 0.28);
    }
    .status-badge.loading .status-dot {
      background: #f59e0b;
      box-shadow: 0 0 6px #f59e0b;
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .market-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-card-inner);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 4px 8px 4px 10px;
      font-size: 11.5px;
      color: var(--text-secondary);
      font-weight: 500;
    }
    .market-pill input {
      background: transparent;
      border: none;
      color: #f1f5f9;
      font-weight: 650;
      font-size: 11.5px;
      width: 54px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .market-pill input:focus {
      outline: none;
      color: var(--accent);
    }

    .btn-benchmark {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-benchmark:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #f8fafc;
    }
    .btn-benchmark.active {
      background: rgba(168, 85, 247, 0.12);
      border-color: rgba(168, 85, 247, 0.35);
      color: #d8b4fe;
    }
    .benchmark-indicator {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--benchmark-color);
      box-shadow: 0 0 6px var(--benchmark-color);
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      backdrop-filter: blur(12px);
    }
    .btn-action:hover {
      background: var(--bg-surface-hover);
      color: #f8fafc;
      border-color: rgba(255, 255, 255, 0.15);
    }

    .btn-util {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-util:hover {
      background: var(--bg-surface-hover);
      color: #f8fafc;
      border-color: rgba(255, 255, 255, 0.15);
    }

    .btn-add-primary, .add-lot-bar .btn-primary {
      background: var(--accent-gradient);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.3);
      transition: all 0.2s;
    }
    .btn-add-primary:hover, .add-lot-bar .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
    }

    .settings-drawer {
      display: none;
      width: 100%;
      margin-top: 8px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .settings-drawer.open {
      display: flex;
    }

    /* KPI GRID COM O CARD ATH DETALHADO */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 18px 20px;
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(14px);
      transition: all 0.2s;
    }
    .kpi-card:hover {
      border-color: rgba(255, 255, 255, 0.12);
      transform: translateY(-1px);
    }
    .kpi-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .kpi-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .kpi-icon {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
    }
    .kpi-val {
      font-size: 24px;
      font-weight: 650;
      letter-spacing: -0.4px;
      font-variant-numeric: tabular-nums;
      color: #f8fafc;
    }
    .kpi-sub {
      font-size: 11px;
      margin-top: 4px;
      color: var(--text-muted);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    /* GRÁFICO AGREGADO TRADINGVIEW */
    .tv-chart-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(14px);
      position: relative;
    }
    .tv-header-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .tv-price-tag {
      font-size: 28px;
      font-weight: 700;
      color: #f8fafc;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: -0.4px;
      flex-wrap: wrap;
    }
    .tv-badge-pill {
      color: #fff;
      font-size: 12px;
      font-weight: 650;
      padding: 3px 10px;
      border-radius: 6px;
      font-variant-numeric: tabular-nums;
    }
    .alpha-pill {
      font-size: 11.5px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 6px;
      background: rgba(168, 85, 247, 0.14);
      border: 1px solid rgba(168, 85, 247, 0.35);
      color: #d8b4fe;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .tv-legend-dots {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      flex-wrap: wrap;
    }
    .tv-legend-dots span {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .dot-buy {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #38bdf8;
      border: 2px solid #ffffff;
      box-shadow: 0 0 6px #38bdf8;
    }
    .line-avg {
      width: 14px;
      height: 2px;
      background: #f59e0b;
      border-top: 1px dashed #f59e0b;
    }
    .line-benchmark {
      width: 14px;
      height: 2px;
      background: var(--benchmark-color);
      border-top: 2px dashed var(--benchmark-color);
    }

    .tv-canvas-wrap {
      height: 280px;
      width: 100%;
      position: relative;
    }

    .tv-bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      flex-wrap: wrap;
      gap: 8px;
    }
    .tv-periods-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tv-p-btn {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid transparent;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 66px;
      transition: all 0.15s;
    }
    .tv-p-btn .lbl {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .tv-p-btn .pct {
      font-size: 11px;
      font-weight: 650;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }
    .tv-p-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.1);
    }
    .tv-p-btn.active {
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.3);
    }
    .tv-p-btn.active .lbl {
      color: #e2e8f0;
    }

    /* SEÇÃO DE ALOCAÇÃO SETORIAL & RAIO-X DE SOBREPOSIÇÃO */
    .sector-analysis-grid {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }
    @media (max-width: 900px) {
      .sector-analysis-grid { grid-template-columns: 1fr; }
    }

    .analysis-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 22px 24px;
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(14px);
    }
    .analysis-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .analysis-title {
      font-size: 15px;
      font-weight: 700;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .donut-layout {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .donut-wrap {
      width: 140px;
      height: 140px;
      position: relative;
      flex-shrink: 0;
    }
    .donut-legend {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-grow: 1;
      font-size: 12px;
    }
    .legend-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.02);
    }
    .legend-name {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--text-secondary);
      font-weight: 500;
    }
    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .legend-pct {
      font-weight: 700;
      color: #f1f5f9;
      font-variant-numeric: tabular-nums;
    }

    .overlap-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .overlap-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: var(--bg-card-inner);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 9px;
    }
    .overlap-name-wrap {
      display: flex;
      flex-direction: column;
    }
    .overlap-title {
      font-size: 13px;
      font-weight: 650;
      color: #f1f5f9;
    }
    .overlap-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .overlap-weights {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-variant-numeric: tabular-nums;
    }
    .overlap-weights .direct {
      font-size: 11px;
      color: var(--text-muted);
    }
    .overlap-weights .total {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
    }

    /* CARD DE COMPOSIÇÃO */
    .card-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 24px;
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(14px);
    }
    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .panel-title {
      font-size: 16px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .comp-table-header {
      display: grid;
      grid-template-columns: 2.4fr 1.2fr 1.4fr 1.3fr 40px;
      align-items: center;
      padding: 0 18px 12px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    @media (max-width: 800px) { .comp-table-header { display: none; } }

    .composition-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }
    .comp-row {
      display: grid;
      grid-template-columns: 2.4fr 1.2fr 1.4fr 1.3fr 40px;
      align-items: center;
      padding: 14px 18px;
      background: var(--bg-card-inner);
      border: 1px solid rgba(255, 255, 255, 0.035);
      border-radius: 12px;
      transition: all 0.2s;
      cursor: pointer;
    }
    .comp-row:hover {
      background: var(--bg-surface-hover);
      border-color: rgba(56, 189, 248, 0.3);
      transform: translateY(-1px);
    }
    @media (max-width: 800px) {
      .comp-row {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
    }

    .stock-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .stock-logo-wrap {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #111726;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 8px;
    }
    .stock-logo-wrap svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .stock-names { display: flex; flex-direction: column; }
    .stock-name-primary { font-size: 13.5px; font-weight: 650; color: #f1f5f9; }
    .stock-name-secondary { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; font-weight: 500; }

    .comp-cell-price {
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      display: flex;
      flex-direction: column;
    }
    .comp-cell-price .price-val { font-weight: 650; color: #f1f5f9; }
    .comp-cell-price .cost-val { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    .comp-cell-weight {
      display: flex;
      flex-direction: column;
      font-variant-numeric: tabular-nums;
    }
    .comp-cell-weight .weight-top {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .comp-cell-weight .weight-top .val-eur { font-weight: 650; color: #f1f5f9; font-size: 13.5px; }
    .comp-cell-weight .weight-top .weight-pct {
      font-weight: 650;
      color: var(--accent);
      font-size: 11px;
      background: rgba(56, 189, 248, 0.1);
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    .weight-bar-bg {
      width: 100%;
      max-width: 130px;
      height: 4px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 2px;
      margin-top: 5px;
      overflow: hidden;
    }
    .weight-bar-fill {
      height: 100%;
      background: var(--accent-gradient);
      border-radius: 2px;
    }

    .comp-cell-gain {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .gain-pill {
      font-size: 12px;
      font-weight: 650;
      padding: 3px 8px;
      border-radius: 5px;
      letter-spacing: -0.1px;
    }
    .gain-sub {
      font-size: 11px;
      font-weight: 600;
      margin-top: 3px;
    }
    .profit { color: var(--tv-green); }
    .profit-pill { background: var(--tv-green-bg); border: 1px solid var(--tv-green-border); color: var(--tv-green); }
    .loss { color: var(--tv-red); }
    .loss-pill { background: var(--tv-red-bg); border: 1px solid var(--tv-red-border); color: var(--tv-red); }

    .action-arrow {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 12px;
      margin-left: auto;
      transition: all 0.2s;
    }
    .comp-row:hover .action-arrow {
      background: var(--accent);
      color: #fff;
      transform: translateX(2px);
    }

    /* MODAIS */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 12, 0.88);
      z-index: 100;
      align-items: center;
      justify-content: c
